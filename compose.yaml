services:
  api:
    build:
      context: .
      dockerfile: src/FinCore.Api/Dockerfile
    container_name: fincore-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fincore;Username=${FINCORE_DB_USER};Password=${FINCORE_DB_PASSWORD}"
      Jwt__Key: "${FINCORE_JWT_KEY}"
      Jwt__Issuer: "${FINCORE_JWT_ISSUER}"
      Jwt__Audience: "${FINCORE_JWT_AUDIENCE}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: fincore-postgres-compose
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: "${FINCORE_DB_USER}"
      POSTGRES_PASSWORD: "${FINCORE_DB_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - fincore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fincore-data:
